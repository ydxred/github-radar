      <stop offset="1" stop-color="#eef4e7"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ddedc8" stop-opacity=".72"/>
      <stop offset="1" stop-color="#ddedc8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="440" height="280" fill="url(#paper)"/>
  <circle cx="406" cy="99" r="157" fill="url(#glow)"/>
