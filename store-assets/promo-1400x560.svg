<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title description">
  <title id="title">开源雷达</title>
  <desc id="description">横版品牌宣传图。每个新标签页，发现好项目。GitHub 热门、金融量化、本地收藏。右侧为装饰性雷达图形，不是产品界面截图。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2=".65">
      <stop offset="0" stop-color="#fafbf7"/>
      <stop offset=".55" stop-color="#f4f8ee"/>
      <stop offset="1" stop-color="#edf4e4"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#dcecc4" stop-opacity=".82"/>
      <stop offset=".62" stop-color="#e1edce" stop-opacity=".44"/>
      <stop offset="1" stop-color="#e8f1db" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#b0d77e" stop-opacity=".05"/>
      <stop offset="1" stop-color="#bfdc98" stop-opacity=".5"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="560" fill="url(#paper)"/>
  <circle cx="1144" cy="265" r="345" fill="url(#glow)"/>
  <g fill="none" stroke="#d5e3c5" stroke-width="1.3">
