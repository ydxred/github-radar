    <circle cx="1144" cy="265" r="137" stroke-width="1.6" opacity=".75"/>
    <circle cx="1144" cy="265" r="73" stroke-width="1.4" opacity=".65"/>
  </g>
  <path d="M1144 265 1282.59 126.41A196 196 0 0 1 1337.02 230.96Z" fill="url(#sweep)"/>
  <path d="M1144 265 1282.59 126.41" stroke="#829f60" stroke-width="5" stroke-linecap="round"/>
  <circle cx="1144" cy="265" r="6" fill="#829f60"/>
  <circle cx="1054" cy="355" r="28" fill="#ddeacb" opacity=".58"/>
  <circle cx="1054" cy="355" r="19" fill="none" stroke="#b2cc93" stroke-width="1.3"/>
