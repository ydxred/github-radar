  <g font-family="Noto Sans CJK SC, sans-serif">
    <text x="195" y="105" font-size="18" font-weight="700" letter-spacing="3.1" fill="#697b60">OPEN SOURCE RADAR</text>
    <text x="196" y="137" font-size="17" letter-spacing="3" fill="#87947e">为好奇心，留一扇窗</text>
